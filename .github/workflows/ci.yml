name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (pinned)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build sim core tests
        run: dotnet build tests/ApexGP.Tests/ApexGP.Tests.csproj --no-incremental

      - name: Run acceptance tests (exit 0 = all pass)
        run: dotnet run --no-build --project tests/ApexGP.Tests

  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2  # pin; bump deliberately
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (pinned — required by the Godot mono build)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot (pinned, .NET/mono variant for C#)
        run: |
          curl -fL -o godot_mono.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot_mono.zip
          BIN="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$BIN"
          "$BIN" --version
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Build game assembly
        run: dotnet build engine/ApexGP.Game.csproj --no-incremental

      - name: Import project (class cache; import may abort benignly on mono headless)
        run: '"$GODOT_BIN" --headless --path engine --import || true'

      - name: Run smoke race (accel + brake assertions)
        run: |
          APEXGP_SMOKE=1 "$GODOT_BIN" --headless --path engine --quit-after 700 2>&1 | tee smoke.log
          grep -q "APEXGP_SMOKE accel=" smoke.log
          accel=$(grep -oE "APEXGP_SMOKE accel=[0-9.]+" smoke.log | head -1 | cut -d= -f2)
          brake=$(grep -oE "APEXGP_SMOKE brake=[0-9.]+" smoke.log | head -1 | cut -d= -f2)
          echo "accel=${accel} km/h, brake_end=${brake} km/h"
          awk -v a="$accel" -v b="$brake" 'BEGIN { exit !((a+0) >= 15.0 && (b+0) <= 5.0) }'
